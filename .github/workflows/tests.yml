name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * *" # 09:00 BRT
  workflow_dispatch:
    inputs:
      browser:
        description: Navegador da regressão
        type: choice
        options: [chrome, firefox, edge]
        default: chrome
      tags:
        description: Expressão de tags do Cucumber para a regressão
        type: string
        default: not @defeito and not @performance

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_ARGS: -B -ntp
  DEFAULT_TAGS: not @defeito and not @performance

jobs:
  smoke:
    name: Smoke (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Executar @smoke
        run: ./mvnw clean test -Dbrowser=chrome -Dcucumber.filter.tags="@smoke and not @defeito"
      - name: Publicar allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-smoke
          path: target/allure-results
          if-no-files-found: ignore
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-smoke
          path: |
            target/cucumber.html
            target/surefire-reports
          if-no-files-found: ignore

  regression:
    name: Regressão (${{ matrix.browser }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.browser) || '["chrome","firefox"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Executar regressão
        env:
          TAGS: ${{ inputs.tags || env.DEFAULT_TAGS }}
        run: ./mvnw clean test -Dbrowser=${{ matrix.browser }} -Dcucumber.filter.tags="$TAGS"
      - name: Publicar allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-regression-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: ignore
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-regression-${{ matrix.browser }}
          path: |
            target/cucumber.html
            target/surefire-reports
          if-no-files-found: ignore

  known-defects:
    name: Defeitos conhecidos (@defeito)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Estes cenários devem falhar enquanto o defeito existir; o job acompanha a correção.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Executar @defeito
        run: ./mvnw clean test -Dbrowser=chrome -Dcucumber.filter.tags="@defeito"
      - name: Publicar allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-known-defects
          path: target/allure-results
          if-no-files-found: ignore

  report:
    name: Allure Report
    needs: [smoke, regression, known-defects]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      REPORT_URL: https://lucasspaula0509.github.io/saucedemo-automation-portifolio/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Juntar allure-results dos jobs
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true
      - name: Recuperar histórico do report anterior
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Preparar histórico e executor
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history target/allure-results/history
          fi
          cat > target/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${REPORT_URL}",
            "reportName": "Swag Labs - Allure Report"
          }
          EOF
      - name: Gerar Allure Report
        run: ./mvnw allure:report
      - name: Publicar report como artifact
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
      - name: Publicar no GitHub Pages
        if: env.PUBLISH == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Allure Report - ${{ github.workflow }} #${{ github.run_number }}"
