# Precedência: -Dchave=valor  >  variável de ambiente (CHAVE_COM_UNDERSCORE)  >  este arquivo
base.url=https://www.saucedemo.com
browser=chrome
headless=false
timeout.seconds=10
window.width=1920
window.height=1080

# Selenium Grid (vazio = execução local). Ex.: http://localhost:4444
grid.url=

# Evidências
screenshot.every.step=false

# Performance (@performance) - limites em milissegundos
perf.login.page.max.ms=3000
perf.login.to.inventory.max.ms=2000
# Largest Contentful Paint: 2500 ms é o limite "bom" do Core Web Vitals
perf.lcp.max.ms=2500
