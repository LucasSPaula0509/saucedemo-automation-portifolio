# Cucumber
cucumber.glue=br.com.saucedemo
cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, json:target/cucumber.json, html:target/cucumber.html
cucumber.publish.quiet=true

# Filtro padrão (sobrescreva com -Dcucumber.filter.tags="...")
cucumber.filter.tags=not @defeito and not @performance

# Execução paralela por cenário (sobrescreva com -Dcucumber.execution.parallel.config.fixed.parallelism=N)
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
